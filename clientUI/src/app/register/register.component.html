<div class="register-container">
  <div class="register-card">
    <div class="image-section">
      <img [src]="shopImage" alt="Shop Logo">
    </div>
    <div class="form-section">
      <h2>Create Account</h2>
      <form [formGroup]="registerForm" (ngSubmit)="submitRegistration()">
        <div class="form-field">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" formControlName="firstName"
            [class.error]="(registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched) || registerForm.get('firstName')?.errors?.['serverError']">
          <span class="error-message">{{getErrorMessage('firstName')}}</span>
        </div>

        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" formControlName="lastName"
            [class.error]="(registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched) || registerForm.get('lastName')?.errors?.['serverError']">
          <span class="error-message">{{getErrorMessage('lastName')}}</span>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email"
            [class.error]="(registerForm.get('email')?.invalid && registerForm.get('email')?.touched) || registerForm.get('email')?.errors?.['serverError']">
          <span class="error-message">{{getErrorMessage('email')}}</span>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password"
            [class.error]="(registerForm.get('password')?.invalid && registerForm.get('password')?.touched) || registerForm.get('password')?.errors?.['serverError']">
          <span class="error-message">{{getErrorMessage('password')}}</span>
        </div>

        <div class="form-field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" formControlName="confirmPassword"
            [class.error]="(registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched) || registerForm.errors?.['passwordMismatch']">
          <span class="error-message">{{getErrorMessage('confirmPassword')}}</span>
        </div>

        <button type="submit" [disabled]="registerForm.invalid">Create Account</button>
      </form>
    </div>
  </div>
</div>
