services:
  api:
    build:
      context: .
      dockerfile: src/EShopApp.Api/Dockerfile
    ports:
      - "5000:5000"
      # - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000;
      - ConnectionStrings__DockerConnection=Server=db;Database=EShopAppDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Password123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Password123", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # redis:
  #   image: redis:latest
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes


volumes:
  sqlserver_data:
  # redis_data:
