<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EShopApp</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script defer src="app.js"></script>
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://js.stripe.com;"> -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>EShopApp</h1>

    <section id="login-section">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="login-result"></div>
    </section>

    <section id="products-section" style="display:none;">
        <h2>Products</h2>
        <div id="products-list"></div>
    </section>

    <section id="cart-section" style="display:none;">
        <h2>Cart</h2>
        <div id="cart-items"></div>
        <div id="total-price"></div>
        <div id="payment-element"></div> <!-- Updated to use Payment Element -->
        <button id="checkout-button">Checkout</button>
        <button id="clear-cart-button">Clear Cart</button>
        <button id="pay-button" style="display:none;">Pay</button> <!-- Pay button -->
        <div id="checkout-result"></div>
        <div id="payment-success" style="display:none; color: green;">Payment successful!</div>
        <!-- Payment success message -->
    </section>
</body>

</html>
